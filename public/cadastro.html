          <input id="input_password1" type="password">

          <button type="button" onclick="register()">Cadastrar</button>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function register() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = input_name.value;
    var emailVar = input_email.value;
    var senhaVar = input_password1.value;
    var confirmacaoSenhaVar = input_password2.value;
    var heightVar = input_height.value
    var weightVar = input_weight.value

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      heightVar == "" ||
      weightVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Preencha todos os campos!";
      setInterval(sumirMensagem, 10000);

      finalizarAguardar();
      return false;
    } 
    else if (heightVar.includes(".") || weightVar.includes(".")) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Se atente as unidades de medida!";
      setInterval(sumirMensagem, 10000);

      finalizarAguardar();
      return false;
    }    
    else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        heightServer: heightVar,
        weightServer: weightVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Houve um erro ao tentar realizar o cadastro!";
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
