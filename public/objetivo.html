<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos | Basketball4life</title>
    <link rel="icon" href="./assets/icon/iconeBola.webp">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/objetivo.css">

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
</head>

<body onload="validarSessao(), getGoal()">
    <header>
        <div>
            <img src="./assets/icon/logo.png" alt="logo">
        </div>

        <div>
            <ul>
                <li><a href="#">Objetivo</a></li>
                <li><a href="./treino.html">Treino</a></li>
                <li><a href="./dashboard/dashboard.html">Dashboard</a></li>
            </ul>
        </div>

        <div>
            <img src="./assets/icon/logo.png" alt="logo">
        </div>
    </header>
    <h1 id="welcome_message">Olá, <span id="span_name"></span></h1>
    <section class="section_goals">
        <div class="container">
            <h1>Objetivos</h1>
            <div class="container_cards">
                <div class="card">
                    <p>
                        <span></span>
                        <span></span>
                        Quantidade de treinos na semana 
                        <img onclick="hideOrShowUpdateTraining(1)" src="./assets/icon/settings.png" height="25" alt="">
                    </p>
                    <span id="qtd_training"></span>
                    <div></div>
                    <div></div>
                </div>
                <div class="card">
                    <p>
                        <span></span>
                        <span></span>
                        Minutos na semana
                        <img onclick="hideOrShowUpdateTraining(1)" src="./assets/icon/settings.png" height="25" alt="">
                    </p>
                    <span id="qtd_minutes"></span>
                    <div></div>
                    <div></div>                
                </div>
            </div>
        </div>
    </section>

    <section class="section_performance">
        <div class="container">
            <div class="container_cards">
                <a style="text-decoration: none;" href="./treino.html">
                    <div class="card">
                        <span>Treino</span>
                    </div>
                </a>
                <a style="text-decoration: none;" href="./dashboard/dashboard.html">
                    <div class="card">
                        <span>Dashboard</span>
                    </div>
                </a>
            </div>
        </div>
    </section>
    <div onclick="hideOrShowUpdateTraining(0)" id="div_update_training" class="div_update_training">
        <form onclick="hideOrShowUpdateTraining(1)" action="">
            <h1>Atualizar Objetivo</h1>
            <div>
                <span>
                    <label for="input_update_qtd">Quantidade:</label>
                    <input id="input_update_qtd" type="number">
                </span>

                <span>
                    <label for="input_update_time">Minutos na semana:</label>
                    <input id="input_update_time" type="number">
                </span>
            </div>
            <button type="button" onclick="updateGoal()">Atualizar</button>
        </form>
    </div>
</body>

</html>

<script>
    function showGoals() {
        qtd_training.innerHTML = sessionStorage.QTD_WEEKLY_GOAL
        qtd_minutes.innerHTML = sessionStorage.TIME_GOAL + "min"
        span_name.innerHTML = sessionStorage.NOME_USUARIO
    }

    function getGoal() {
        var user_id = Number(sessionStorage.ID_USUARIO)
        fetch(`/goal/get-goal/${user_id}`)
        .then((result) => {
            if (result.ok) {
                result.json()
                .then((json) => {
                    console.log(json);
                    sessionStorage.QTD_WEEKLY_GOAL = json[0].qtd_weekly_goal
                    sessionStorage.TIME_GOAL = json[0].time_goal

                    showGoals()
                })
            }
        })
        .catch((err) => {
            console.log(err)
        })
    }

    var cont = 1
    input_update_qtd.value = sessionStorage.QTD_WEEKLY_GOAL
    input_update_time.value = sessionStorage.TIME_GOAL
    function hideOrShowUpdateTraining(situation) {
        if (cont % 2 == 0 && situation == 0) {
            div_update_training.style.display = 'none'
            cont = 0
        } else {
            div_update_training.style.display = 'flex'
            showUpdateTrainingSituation = 1
        }
        console.log(cont);
        
        cont++
    }

    function updateGoal() {
        var user_id = Number(sessionStorage.ID_USUARIO)
        var time_goal = Number(input_update_time.value)
        var qtd = Number(input_update_qtd.value)

        if (user_id > 0 && time_goal > 0 && qtd > 0) {
            fetch("/goal/update-goal", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    user_id: user_id,
                    time_goal: time_goal,
                    qtd: qtd
                })
            })
            .then((json) => {
                console.log(json);
                hideOrShowUpdateTraining(0)
                getGoal()
            })
            .catch((err) => {
                console.log(err);
            })
        } else {
            // error message

        }

    }
</script>
