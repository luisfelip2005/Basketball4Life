<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos | Basketball4life</title>
    <link rel="icon" href="./assets/icon/iconeBola.webp">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/objetivo.css">

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
</head>

<body onload="validarSessao(), exibirObjetivos()">
    <header>
        <div>
            <img src="./assets/icon/logo.png" alt="logo">
        </div>

        <div>
            <ul>
                <li><a href="#">Objetivo</a></li>
                <li><a href="./treino.html">Treino</a></li>
                <li><a href="./dashboard/dashboard.html">Dashboard</a></li>
            </ul>
        </div>

        <div>
            <img src="./assets/icon/logo.png" alt="logo">
        </div>
    </header>
    <h1 id="welcome_message">Olá, <span id="span_name"></span></h1>
    <section class="section_goals">
        <div class="container">
            <h1>Objetivos</h1>
            <div class="container_cards">
                <div class="card">
                    <p>
                        <span></span>
                        <span></span>
                        Quantidade de treinos na semana 
                        <img src="./assets/icon/settings.png" height="25" alt="">
                    </p>
                    <span id="qtd_training"></span>
                    <div></div>
                    <div></div>
                </div>
                <div class="card">
                    <p>
                        <span></span>
                        <span></span>
                        Minutos na semana
                        <img src="./assets/icon/settings.png" height="25" alt="">
                    </p>
                    <span id="qtd_minutes"></span>
                    <div></div>
                    <div></div>                </div>
            </div>
        </div>
    </section>

    <section class="section_performance">
        <div class="container">
            <div class="container_cards">
                <a style="text-decoration: none;" href="./treino.html">
                    <div class="card">
                        <span>Treino</span>
                    </div>
                </a>
                <a style="text-decoration: none;" href="./dashboard/dashboard.html">
                    <div class="card">
                        <span>Dashboard</span>
                    </div>
                </a>
            </div>
        </div>
    </section>
</body>

</html>

<script>
    function exibirObjetivos() {
        qtd_training.innerHTML = sessionStorage.QTD_WEEKLY_GOAL
        qtd_minutes.innerHTML = sessionStorage.TIME_GOAL + "min"
        span_name.innerHTML = sessionStorage.NOME_USUARIO
    }
</script>
